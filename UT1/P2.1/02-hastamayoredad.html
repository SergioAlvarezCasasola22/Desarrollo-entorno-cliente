<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hasta mayor de edad</title>
</head>
<body>
  <script>
    let edad = prompt("Introduce tu edad:");

    while (edad < 18) {
      edad = prompt("Eres menor de edad, introduce tu edad de nuevo:");
    }

    document.write("<h1>Bienvenido, ya eres mayor de edad</h1>");
  </script>
</body>
</html>
